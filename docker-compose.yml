version: '3.8'

services:
  todo-mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tododb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-backend
    restart: always
    ports:
      - "5076:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=todo-mysql;Database=tododb;User=root;Password=root;
      - Jwt__Key=SuperSecretKeyForTodoApp123456!!!PleaseChangeMeInProduction
      - Jwt__Issuer=todoapp-backend
      - Jwt__Audience=todoapp-frontend
    depends_on:
      todo-mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../todoapp-frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data: